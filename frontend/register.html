<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechMart Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        :root {
            --tm-bg-start: #f7f4ea;
            --tm-bg-end: #d8efe3;
            --tm-brand: #0f766e;
            --tm-brand-dark: #134e4a;
            --tm-accent: #f59e0b;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 80% 10%, rgba(15, 118, 110, 0.18), transparent 24%),
                linear-gradient(145deg, var(--tm-bg-start), var(--tm-bg-end));
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .auth-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .auth-card {
            width: 100%;
            max-width: 500px;
            border: 0;
            border-radius: 1.25rem;
            box-shadow: 0 20px 45px rgba(19, 78, 74, 0.18);
            overflow: hidden;
            animation: riseIn 0.45s ease;
        }

        .brand-strip {
            background: linear-gradient(90deg, var(--tm-brand-dark), var(--tm-brand));
            color: #fff;
            padding: 1rem 1.25rem;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.18);
            font-weight: 700;
            margin-right: 0.65rem;
        }

        .strength-meter {
            height: 6px;
            border-radius: 999px;
            background: #e9ecef;
            overflow: hidden;
        }

        .strength-meter>span {
            display: block;
            height: 100%;
            width: 0;
            transition: width 0.2s ease;
        }

        @keyframes riseIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="auth-wrap">
        <div class="card auth-card">
            <div class="brand-strip d-flex align-items-center">
                <div class="brand-logo">TM</div>
                <div>
                    <h5 class="mb-0">Customer Support AI</h5>
                    <small>Create your account</small>
                </div>
            </div>

            <div class="card-body p-4 p-md-5">
                <div id="register-error" class="alert alert-danger d-none" role="alert"></div>
                <div id="register-success" class="alert alert-success d-none" role="alert"></div>

                <form id="register-form" onsubmit="register(event)">
                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" id="username" class="form-control" minlength="3" maxlength="50" required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="register-email">Email</label>
                        <input type="email" id="register-email" class="form-control" required />
                    </div>

                    <div class="mb-2">
                        <label class="form-label" for="register-password">Password</label>
                        <input type="password" id="register-password" class="form-control" minlength="8"
                            oninput="updatePasswordStrength(this.value)" required />
                    </div>

                    <div class="mb-2 strength-meter"><span id="strength-fill" class="bg-danger"></span></div>
                    <small id="strength-text" class="text-muted">Strength: weak</small>

                    <div class="mt-3 mb-4">
                        <label class="form-label" for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" class="form-control" minlength="8" required />
                    </div>

                    <button id="register-btn" type="submit"
                        class="btn btn-success w-100 d-flex justify-content-center align-items-center gap-2">
                        <span id="register-spinner" class="spinner-border spinner-border-sm d-none"
                            aria-hidden="true"></span>
                        <span>Register</span>
                    </button>
                </form>

                <p class="mt-4 mb-0 text-center">
                    Already have an account?
                    <a href="login.html" class="text-decoration-none">Back to login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>

</html>
