<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMart Chat Support</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-3" style="height: 56px;">
        <div class="container-fluid px-0">
            <button class="btn btn-outline-secondary d-md-none me-2" type="button" id="sidebarToggle">
                <i class="bi bi-list"></i>
            </button>
            
            <a class="navbar-brand d-flex align-items-center" href="#">
                <span class="text-primary-brand fw-bold fs-4 me-2">TechMart</span>
                <span class="text-muted d-none d-sm-inline">Customer Support</span>
            </a>
            
            <div class="d-flex align-items-center ms-auto">
                <span id="navUsername" class="badge bg-secondary me-3 p-2">User</span>
                <button class="btn btn-sm btn-outline-danger" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Layout -->
    <div class="chat-container">
        
        <!-- Sidebar -->
        <div class="sidebar py-3" id="sidebar">
            <div class="px-3 mb-3">
                <button class="btn btn-success w-100" onclick="startNewSession()">
                    <i class="bi bi-plus-lg me-1"></i> New Chat
                </button>
            </div>
            
            <div class="px-3 mb-2 text-uppercase text-muted small fw-bold">Recent Sessions</div>
            <div id="sessionList" class="flex-grow-1 overflow-auto">
                <!-- Session items will be injected here -->
            </div>
            
            <div class="px-3 mt-auto pt-3 border-top border-secondary">
                <button type="button" id="myTicketsBtn" class="btn btn-dark border-secondary w-100 d-flex justify-content-between align-items-center py-2 px-3 rounded text-white tickets-sidebar-btn shadow-sm" title="Click to view Support Tickets">
                    <span class="fw-semibold"><i class="bi bi-ticket-detailed-fill me-2 text-warning"></i> My Tickets</span>
                    <span id="ticketCount" class="badge bg-primary rounded-pill px-2 py-1 fs-6">0</span>
                </button>
            </div>
        </div>

        <!-- Chat Window -->
        <div class="chat-window">
            
            <!-- Messages Area -->
            <div class="messages-area" id="messagesArea">
                <!-- Messages will be injected here -->
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="d-flex align-items-center mb-1 justify-content-end">
                    <small id="charCount" class="text-muted">0/1000</small>
                </div>
                <form id="chatForm" onsubmit="sendMessage(event)" class="d-flex gap-2">
                    <input type="text" id="messageInput" class="form-control" placeholder="Type your message..." maxlength="1000" autocomplete="off" required>
                    <button type="submit" id="sendBtn" class="btn btn-primary-brand">
                        <i class="bi bi-send-fill"></i>
                    </button>
                </form>
            </div>
            
        </div>
    </div>

    <!-- Tickets Modal -->
    <div class="modal fade" id="ticketsModal" tabindex="-1" aria-labelledby="ticketsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title d-flex align-items-center" id="ticketsModalLabel">
                        <i class="bi bi-ticket-detailed me-2 text-primary-brand"></i> Support Tickets
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-3 bg-light">
                    <div id="ticketsLoading" class="text-center py-5 d-none">
                        <div class="spinner-border text-danger" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2 text-muted">Fetching your tickets...</p>
                    </div>
                    <div id="ticketsEmpty" class="text-center py-5 d-none">
                        <i class="bi bi-inbox text-muted display-4"></i>
                        <h6 class="mt-3 text-secondary">No support tickets found</h6>
                        <p class="text-muted small mb-0">Tickets are created automatically when an issue needs escalation or specialized follow-up.</p>
                    </div>
                    <div id="ticketsList" class="d-flex flex-column gap-3">
                        <!-- Ticket cards injected here -->
                    </div>
                </div>
                <div class="modal-footer bg-white">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Ticket Alert Toast -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="ticketToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header bg-primary text-white">
                <i class="bi bi-ticket-fill me-2"></i>
                <strong class="me-auto">Ticket Created</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="ticketToastBody">
                Ticket # has been created.
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth_guard.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
