<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechMart Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        :root {
            --tm-bg-start: #f7f4ea;
            --tm-bg-end: #d8efe3;
            --tm-brand: #0f766e;
            --tm-brand-dark: #134e4a;
            --tm-accent: #f59e0b;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, rgba(245, 158, 11, 0.15), transparent 25%),
                linear-gradient(145deg, var(--tm-bg-start), var(--tm-bg-end));
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .auth-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            border: 0;
            border-radius: 1.25rem;
            box-shadow: 0 20px 45px rgba(19, 78, 74, 0.18);
            overflow: hidden;
            animation: riseIn 0.45s ease;
        }

        .brand-strip {
            background: linear-gradient(90deg, var(--tm-brand-dark), var(--tm-brand));
            color: #fff;
            padding: 1rem 1.25rem;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.18);
            font-weight: 700;
            margin-right: 0.65rem;
        }

        .password-toggle {
            cursor: pointer;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }

        @keyframes riseIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="auth-wrap">
        <div class="card auth-card">
            <div class="brand-strip d-flex align-items-center">
                <div class="brand-logo">TM</div>
                <div>
                    <h5 class="mb-0">Customer Support AI</h5>
                    <small>Sign in to continue</small>
                </div>
            </div>
            <div class="card-body p-4 p-md-5">
                <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

                <form id="login-form" onsubmit="login(event)">
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-group">
                            <input type="password" id="password" class="form-control" required />
                            <button type="button" class="btn btn-outline-secondary password-toggle"
                                onclick="togglePassword('password', this)"
                                aria-label="Show or hide password">Show</button>
                        </div>
                    </div>

                    <button id="login-btn" type="submit"
                        class="btn btn-success w-100 d-flex justify-content-center align-items-center gap-2">
                        <span id="login-spinner" class="spinner-border spinner-border-sm d-none"
                            aria-hidden="true"></span>
                        <span>Login</span>
                    </button>
                </form>

                <p class="mt-4 mb-0 text-center">
                    New here?
                    <a href="register.html" class="text-decoration-none">Create an account</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>

</html>
