<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMart - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light py-4">

    <div class="card shadow-sm p-4" style="max-width: 480px; width: 100%;">
        <div class="text-center mb-4">
            <h2 class="text-primary-brand fw-bold mb-1">TechMart</h2>
            <p class="text-muted">Customer Support Portal</p>
        </div>

        <div id="registerError" class="alert alert-danger d-none" role="alert"></div>
        <div id="registerSuccess" class="alert alert-success d-none" role="alert"></div>

        <form id="registerForm" onsubmit="register(event)">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" required minlength="3">
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group mb-1">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" required minlength="8">
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password')">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div class="progress" style="height: 5px;">
                    <div id="strengthMeter" class="progress-bar" role="progressbar" style="width: 0%;"></div>
                </div>
                <div id="strengthText" class="mt-1 small"></div>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="confirmPassword" required>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirmPassword')">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="registerBtn" class="btn btn-primary-brand w-100 py-2 mb-3">
                <span id="registerSpinner" class="spinner-border spinner-border-sm d-none me-2" role="status" aria-hidden="true"></span>
                Register
            </button>
            
            <div class="text-center">
                <a href="login.html" class="text-decoration-none text-primary-brand">Already have an account? Login</a>
            </div>
        </form>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
